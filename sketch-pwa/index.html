<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketch CRUD - Browser Drawing App</title>
  <meta name="description" content="A browser-based drawing application with full CRUD for saved drawings">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Cpath d='M20 50 L40 30 L60 70 L80 50' stroke='white' stroke-width='10' fill='none'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Main Canvas Area -->
    <main class="canvas-area">
      <div class="toolbar">
        <div class="toolbar-group">
          <label for="drawingName">Drawing Name:</label>
          <input type="text" id="drawingName" class="input-drawing-name" placeholder="Enter drawing name...">
        </div>
        
        <div class="toolbar-group">
          <label for="colorPicker">Color:</label>
          <input type="color" id="colorPicker" class="color-picker" value="#000000">
        </div>
        
        <div class="toolbar-group">
          <label for="brushSize">Brush Size:</label>
          <input type="range" id="brushSize" class="slider-brush-size" min="1" max="20" value="3">
        </div>
        
        <div class="toolbar-group">
          <button id="undoButton" class="btn btn-secondary">Undo</button>
          <button id="clearButton" class="btn btn-secondary">Clear</button>
          <button id="saveButton" class="btn btn-primary">Save Drawing</button>
        </div>
      </div>
      
      <div class="canvas-container">
        <canvas id="sketchCanvas"></canvas>
      </div>
    </main>
    
    <!-- Drawings Panel -->
    <aside class="drawings-panel">
      <div class="panel-header">
        <h2>My Drawings</h2>
      </div>
      <div class="panel-content">
        <div id="drawingsList" class="drawings-list">
          <p class="no-drawings">Loading drawings...</p>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="canvas.js"></script>
  <script type="module" src="storage.js"></script>
  <script type="module" src="app.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
