<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Budget</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <!-- Header with month picker -->
    <header class="header" id="month-header">
      <div class="month-nav">
        <button class="month-prev" title="Previous month">&lt;</button>
        <span class="month-label">Loading...</span>
        <button class="month-next" title="Next month">&gt;</button>
      </div>
    </header>

    <!-- Summary section -->
    <section class="summary" id="summary">
      <div class="summary-item">
        <div class="summary-label">Income</div>
        <div class="summary-value income-val">$0.00</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Expenses</div>
        <div class="summary-value expense-val">$0.00</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Net</div>
        <div class="summary-value net-val">$0.00</div>
      </div>
    </section>

    <!-- Add transaction form -->
    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form" class="form-grid">
        <div class="form-group">
          <label for="trans-date">Date</label>
          <input type="date" id="trans-date">
        </div>
        <div class="form-group">
          <label for="trans-desc">Description</label>
          <input type="text" id="trans-desc" placeholder="e.g., Groceries">
        </div>
        <div class="form-group">
          <label for="trans-category">Category</label>
          <input type="text" id="trans-category" placeholder="e.g., Food">
        </div>
        <div class="form-group">
          <label for="trans-amount">Amount ($)</label>
          <input type="number" id="trans-amount" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group kind-toggle">
          <label>Kind:</label>
          <label><input type="radio" name="kind" value="income" checked> Income</label>
          <label><input type="radio" name="kind" value="expense"> Expense</label>
        </div>
        <div class="form-group">
          <button type="submit" style="padding: 10px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer;">Add Transaction</button>
        </div>
      </form>
    </section>

    <!-- Transactions list -->
    <section class="transactions-section">
      <h2>Transactions</h2>
      <div id="transactions-list"></div>
    </section>

    <!-- Per-category budgets section -->
    <section class="budgets-section" id="budgets-section">
      <h2>Category Budgets</h2>
      <div class="no-budgets">No transactions or budgets yet</div>
    </section>

    <!-- Export/Import buttons -->
    <div class="action-buttons">
      <button id="export-btn" class="export-btn">Export Backup</button>
      <button id="import-btn" class="import-btn">Import Backup</button>
    </div>
  </div>

  <script src="./budget.js"></script>
  <script src="./app.js"></script>
</body>
</html>
